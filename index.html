<!DOCTYPE html>
<html>
<head>
    <title>Soccer Betting Ticket Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/lantinghei-tc" rel="stylesheet">
    <style>
        /* Force exact sizing for metadata lines */
        .ticket-meta-line,
        .ticket-meta-line span {
            font-family: 'Courier New', monospace !important;
            font-size: 10px !important;
            line-height: 1.1 !important;
        }

        /* Ticket details */
        .ticket-details,
        .ticket-details div {
            font-family: 'Courier New', monospace !important;
            font-size: 10px !important;
        }

        /* Quota type */
        .ticket-section-header {
            font-family: Arial, sans-serif !important;
            font-size: 14px !important;
        }

        /* League name */
        .league-header {
            font-family: Arial, sans-serif !important;
            font-size: 9px !important;
        }

        /* Importo Scommesso */
        .ticket-amount.large-amount {
            font-family: Arial, sans-serif !important;
            font-size: 17px !important;
        }

        /* Team names */
        .ticket-match-teams {
            font-family: Arial, sans-serif !important;
            font-size: 11px !important;
            font-weight: bold !important;
        }

        /* Match details */
        .ticket-match > .ticket-amount,
        .ticket-match > .ticket-amount div {
            font-family: Arial, sans-serif !important;
            font-size: 9px !important;
            font-weight: 500 !important;
        }

        .ticket-meta-line {
            display: flex;
            justify-content: space-between;
            margin: 2px 0;
        }

        .bet-odds-row {
            font-size: 10px !important;
            display: flex;
            width: 100%;
        }

        .bet-type {
            flex: 1;
            white-space: nowrap;
            text-align: left;
        }

        .bet-chosen {
            padding-right: 0;
            white-space: pre;
        }

        .odds-value {
            width: 50px;
            text-align: right;
        }
        .bet-type, .bet-chosen, .odds-value {
            font-weight: 500 !important;
        }
        body {
            padding: 20px;
            font-family: monospace !important;
        }
        .header-label {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .section-label {
            font-size: 16px;
            font-weight: bold;
            margin: 15px 0 10px 0;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        .scroll-pane {
            border: 1px solid #ddd;
            padding: 10px;
            height: auto;
            overflow-y: auto;
            margin-top: 10px;
        }
        .ticket-container {
            width: 80mm;
            margin: 0 auto;
            font-family: 'Courier New', monospace;
            font-size: 9px;
        }
        .ticket {
            width: 80mm;
            border: 1px solid #000;
            padding: 5px;
            background-color: white;
        }
        .ticket-header {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 5px !important;
        }
        .ticket-logo {
            height: 45px;
        }
        .ticket-qr {
            height: 70px;
        }
        .ticket-line {
            border-top: 1px solid #000;
            margin: 0 !important;
            width: calc(100% + 20px);
        }
        .ticket-details {
            margin: 0 !important;
            padding: 0 0 0 4px !important;
            line-height: 1 !important;
            font-weight: bold !important;
            border-left: 1px solid #000;
        }
        .ticket-details div {
            display: flex;
            justify-content: space-between;
            white-space: nowrap;
            max-width: 100%;
            overflow: hidden;
        }
        .ticket-section {
            margin: 2px 0 !important;
        }
        .ticket-section-header {
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            margin: 2px 0 !important;
            padding: 0 !important;
            margin-top: 0 !important;
            padding-top: 0 !important;
        }
        .ticket-match {
            margin: 1px 0 !important;
            line-height: 1 !important;
        }
        .ticket-match-teams {
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70mm !important;
        }
        .ticket-amount {
            display: flex;
            justify-content: space-between;
            margin: 1px 0;
            font-size: 15px !important;
        }
        .ticket-winnings {
            border: 1px solid #000;
            border-left: 1px solid #000 !important;
            border-right: 1px solid #000 !important;
            height: 50px !important;
            display: flex;
            margin: 5px 0;
        }
        .ticket-winnings-pattern {
            width: 77px;
            height: 100%;
            background: repeating-linear-gradient(
                to right,
                #000,
                #000 3px,
                transparent 3px,
                transparent 8px
            );
        }
        .ticket-winnings-center {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .ticket-winnings-label {
            font-weight: 500 !important;
            font-size: 18px !important;
            margin-bottom: 2px !important;
        }
        .ticket-winnings-amount {
            font-family: "Arial Black", "Segoe UI Black", sans-serif !important;
            font-weight: 600 !important;
            font-size: 26px !important;
        }
        .footer-disclaimer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .footer-single-image {
            width: 53mm !important;
            max-width: 53mm !important;
            height: auto !important;
            margin: 5px auto 0 !important;
            display: block;
            object-fit: contain;
        }

        .ticket-footer {
            display: block !important;
            width: 100% !important;
            margin: 0 auto !important;
            padding: 0 !important;
        }
        .ticket-barcode {
            width: 260px;
            height: 80px;
            margin: 2px auto !important;
            display: block;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
        }
        .ticket-disclaimer {
            font-size: 6px !important;
            font-weight: bold;
            margin-top: 5px;
            margin-bottom: 2px !important;
            padding-bottom: 0 !important;
            line-height: 1.2;
            text-align: center;
            padding: 0;
            white-space: normal !important;
        }
        .hidden {
            display: none;
        }
        .status-message {
            color: green;
            margin-top: 5px;
            font-weight: bold;
            font-size: 12px;
        }
        .league-header {
            border-top: 1px solid #000;
            border-bottom: 1px solid #000;
            font-weight: bold;
            text-align: center;
            padding: 1px 0;
            margin: 2px auto;
            width: 100%;
        }
        .large-amount {
          font-size: 17px !important;
          font-weight: bolder !important;
          margin: 5px 0 !important;
        }

        .large-amount div {
          font-size: inherit !important;
        }

        @media print {
            body, html {
                margin: 0 !important;
                padding: 0 !important;
                width: 80mm !important;
                height: auto !important;
                background: white !important;
                font-family: 'Courier New', monospace !important;
                font-size: 9px !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            body {
                transform: translateX(-2mm) !important;
                position: relative !important;
                left: 0 !important;
            }

            .ticket-container {
                width: 76mm !important;
                min-width: 76mm !important;
                max-width: 76mm !important;
                margin: 0 !important;
                padding: 0 0 0 2mm !important;
                position: relative !important;
                left: 0 !important;
                overflow: visible !important;
            }

            .ticket {
                width: 76mm !important;
                min-width: 76mm !important;
                max-width: 76mm !important;
                margin: 0 !important;
                padding: 2mm 3mm !important;
                border: none !important;
                box-sizing: border-box !important;
                position: relative !important;
                left: -1mm !important;
            }

            .ticket * {
                margin-left: 0 !important;
                padding-left: 0 !important;
                text-align: left !important;
            }

            .ticket-header {
                padding-left: 1mm !important;
            }

            .ticket-details {
                padding-left: 1mm !important;
            }

            .ticket-line {
                margin-left: -3mm !important;
                width: 80mm !important;
            }

            @page {
                size: 80mm auto;
                margin: 0 !important;
                padding: 0 !important;
                margin-left: -4mm !important;
            }
            .ticket-disclaimer {
                position: relative !important;
                left: 50% !important;
                transform: translateX(-50%) !important;
                text-align: center !important;
                align-items: center;
                width: 74mm !important;
                margin: 1mm 0 !important;
                padding: 0 !important;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-label">Soccer Betting Ticket Generator</div>

    <div class="form-grid">
        <!-- Match Details -->
        <div class="form-group">
            <label>Team 1:</label>
            <input type="text" class="form-control" id="team1Field">
        </div>
        <div class="form-group">
            <label>Team 2:</label>
            <input type="text" class="form-control" id="team2Field">
        </div>
        <div class="form-group">
            <label>Odds:</label>
            <input type="number" step="0.01" class="form-control" id="oddsField">
        </div>
        <div class="form-group">
            <label>Bet Amount:</label>
            <input type="number" step="0.01" class="form-control" id="betAmountField">
        </div>
        <div class="form-group">
            <label>Quota Type:</label>
            <select class="form-control" id="quotaTypeField">
                <option value="SINGOLA QUOTA FISSA">SINGOLA QUOTA FISSA</option>
                <option value="MULTIPLA QUOTA FISSA">MULTIPLA QUOTA FISSA</option>
            </select>
        </div>
        <div class="form-group">
            <label>Company:</label>
            <select class="form-control" id="companyField">
                <option value="GOLDBET">GOLDBET</option>
                <option value="INTRALOT">INTRALOT</option>
                <option value="BETTER">BETTER</option>
                <option value="PLANETWIN">PLANETWIN</option>
            </select>
            <div class="form-check mt-2">
                <input type="checkbox" class="form-check-input" id="showBottomImageField" checked>
                <label class="form-check-label" for="showBottomImageField" style="font-size: 12px;">Show bottom image</label>
            </div>
        </div>
        <div class="form-group">
            <label>League Name:</label>
            <input type="text" class="form-control" id="leagueNameField">
        </div>
        <div class="form-group">
            <label>Bet Type:</label>
            <input type="text" class="form-control" id="betTypeField" value="1X2">
        </div>
        <div class="form-group">
            <label>Bet Chosen:</label>
            <input type="text" class="form-control" id="betChosenField" value="1">
        </div>
        <div class="form-group hidden" id="bonusGroup">
            <label>Bonus:</label>
            <input type="number" step="0.01" class="form-control" id="bonusField" value="0">
        </div>

        <!-- Ticket Details -->
        <div class="form-group">
            <label>Ticket Code (CB):</label>
            <input type="text" class="form-control" id="ticketCodeField">
        </div>
        <div class="form-group">
            <label>TG:</label>
            <input type="text" class="form-control" id="tgField" value="WEB">
        </div>
        <div class="form-group">
            <label>IB:</label>
            <input type="text" class="form-control" id="ibField" value="INTERNET">
        </div>
        <div class="form-group">
            <label>NS:</label>
            <input type="text" class="form-control" id="nsField" value="ONLINE">
        </div>

        <!-- NEW: Add the editable metadata fields HERE -->
        <div class="form-group">
            <label>CC:</label>
            <input type="text" class="form-control" id="ccField" value="4098">
        </div>
        <div class="form-group">
            <label>NC:</label>
            <input type="text" class="form-control" id="ncField" value="GBO Italy S.p.A">
        </div>
        <div class="form-group">
            <label>PV:</label>
            <input type="text" class="form-control" id="pvField" value="14274">
        </div>
        <div class="form-group">
            <label>TM:</label>
            <input type="text" class="form-control" id="tmField" value="4">
        </div>
        <div class="form-group">
            <label>NP:</label>
            <input type="text" class="form-control" id="npField" value="Lignano Sabbiadoro, Via Arcobalen">
        </div>
        <div class="form-group">
            <label>CG:</label>
            <input type="text" class="form-control" id="cgField" value="2005376">
        </div>
        <div class="form-group">
            <label>Timestamp (OE):</label>
            <input type="text" class="form-control" id="timestampField">
        </div>
        <div class="form-group">
            <label>Date (GE):</label>
            <input type="date" class="form-control" id="matchDatePicker">
        </div>

        <!-- Match Metadata -->
        <div class="form-group">
            <label>Match ID:</label>
            <input type="text" class="form-control" id="matchIdField">
        </div>
        <div class="form-group">
            <label>Code:</label>
            <input type="text" class="form-control" id="codeField">
        </div>
        <div class="form-group">
            <label>Sport Type:</label>
            <input type="text" class="form-control" id="sportField" value="FOOTBALL">
        </div>
        <div class="form-group">
            <label>Match Date:</label>
            <input type="text" class="form-control" id="dateField">
        </div>
        <div class="form-group">
            <label>Match Time:</label>
            <input type="text" class="form-control" id="timeField">
        </div>

        <!-- Buttons -->
        <div class="form-group">
            <button class="btn btn-primary" id="addMatchBtn">Add Match</button>
            <div id="addMatchStatus" class="status-message"></div>
        </div>
        <div class="form-group">
            <button class="btn btn-success" id="generateTicketBtn">Generate Ticket</button>
            <div id="generateTicketStatus" class="status-message"></div>
        </div>
        <div class="form-group">
            <button class="btn btn-info" id="printTicketBtn">Print Ticket</button>
            <div id="printTicketStatus" class="status-message"></div>
        </div>
        <div class="form-group">
            <button class="btn btn-warning" id="clearBtn">Clear All</button>
        </div>
    </div>

    <div class="section-label">Ticket Preview:</div>
    <div class="scroll-pane">
        <div class="ticket-container" id="ticketContainer">
            <!-- Ticket preview will be generated here -->
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script>
    // Store matches
    let matches = [];

    // Image URLs - MODIFIED to include Intralot
    const imageUrls = {
        goldbetLogo: "https://i.ibb.co/C3RgRj17/6cfbcfb3-e7ab-43af-9cff-93041a9c838e.jpg",
        intralotLogo: "https://i.ibb.co/6cB52fXP/Image.jpg",
        goldbetTitle: "https://i.ibb.co/spL1p47B/6db9b7f1-1ac8-4b30-9925-07b9a890ba72.jpg",
        goldbetFooter: "https://i.ibb.co/LDQfJCHH/2fe1a920-87e5-410f-b548-33d86ac92231.jpg", // RENAMED from 'footer'
        intralotFooter: "https://i.ibb.co/T5SVfZc/IMG-3075.jpg", // NEW
        intralotBottom: "https://i.ibb.co/Lhc8DT2X/IMG-3077-2.jpg",
        betterLogo: "https://i.ibb.co/SX5mn92j/Chat-GPT-Image-May-18-2026-at-07-33-06-PM.png",
        planetwinLogo: "https://i.ibb.co/YqCHZxx/planetwin2.png",
        qrCode: "https://i.ibb.co/kgQjhSxd/qr-code.png",
        get barcode() {
            const canvas = document.createElement("canvas");
            JsBarcode(canvas, document.getElementById('ticketCodeField').value || "TICKET", {
                format: "CODE128",
                width: 2,
                height: 60,
                displayValue: false
            });
            return canvas.toDataURL("image/png");
        }
    };

    // Initialize when DOM is fully loaded
    document.addEventListener('DOMContentLoaded', function() {
        // Set default values
        document.getElementById('ticketCodeField').value = Math.random().toString(36).substring(2, 10).toUpperCase();
        document.getElementById('timestampField').value = new Date().toLocaleTimeString();
        document.getElementById('matchDatePicker').valueAsDate = new Date();

        // Set current date in date field
        const today = new Date();
        const day = String(today.getDate()).padStart(2, '0');
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const year = today.getFullYear();
        document.getElementById('dateField').value = `${day}-${month}-${year}`;
        document.getElementById('timeField').value = today.toTimeString().substring(0, 5);

        // Button event listeners
        document.getElementById('addMatchBtn').addEventListener('click', handleAddMatch);
        document.getElementById('generateTicketBtn').addEventListener('click', handleGenerateTicket);
        document.getElementById('printTicketBtn').addEventListener('click', handlePrintTicket);
        document.getElementById('clearBtn').addEventListener('click', handleClearAll);
    });

    function handleAddMatch() {
        try {
            const match = {
                team1: document.getElementById('team1Field').value.trim(),
                team2: document.getElementById('team2Field').value.trim(),
                odds: parseFloat(document.getElementById('oddsField').value),
                betAmount: parseFloat(document.getElementById('betAmountField').value),
                quotaType: document.getElementById('quotaTypeField').value.trim(),
                company: document.getElementById('companyField').value.trim(), // ADD THIS
                leagueName: document.getElementById('leagueNameField').value.trim(),
                betType: document.getElementById('betTypeField').value.trim(),
                betChosen: document.getElementById('betChosenField').value.trim(),
                matchId: document.getElementById('matchIdField').value.trim(),
                code: document.getElementById('codeField').value.trim(),
                sport: document.getElementById('sportField').value.trim(),
                date: document.getElementById('dateField').value.trim(),
                time: document.getElementById('timeField').value.trim(),
                matchDate: document.getElementById('matchDatePicker').value
            };

            // Validate required fields
            if (!match.team1 || !match.team2 || isNaN(match.odds)) {
                throw new Error('Please fill in Team 1, Team 2, and valid Odds');
            }

            matches.push(match);

            // Show bonus field after 5 matches
            if (matches.length >= 5) {
                document.getElementById('bonusGroup').classList.remove('hidden');
            }

            // Clear only match input fields
            ['team1Field', 'team2Field', 'oddsField', 'leagueNameField',
             'matchIdField', 'codeField', 'dateField', 'timeField'].forEach(id => {
                document.getElementById(id).value = '';
            });

            updateMatchList();
            showStatus('addMatchStatus', 'Match added successfully!');
        } catch (error) {
            alert(error.message);
            console.error('Add Match Error:', error);
        }
    }

    function handleGenerateTicket() {
        try {
            if (matches.length === 0) {
                throw new Error('Please add at least one match first!');
            }

            const betAmount = parseFloat(document.getElementById('betAmountField').value);
            if (isNaN(betAmount)) {
                throw new Error('Please enter a valid bet amount');
            }

            const bonusAmount = parseFloat(document.getElementById('bonusField').value) || 0;
            const selectedCompany = document.getElementById('companyField').value.trim(); // GET COMPANY

            const showBottomImage = document.getElementById('showBottomImageField').checked;

            const ticketData = {
                ticketCode: document.getElementById('ticketCodeField').value.trim(),
                timestamp: document.getElementById('timestampField').value.trim(),
                tg: document.getElementById('tgField').value.trim(),
                date: document.getElementById('matchDatePicker').value,
                ib: document.getElementById('ibField').value.trim(),
                ns: document.getElementById('nsField').value.trim(),
                cc: document.getElementById('ccField').value.trim(),
                nc: document.getElementById('ncField').value.trim(),
                pv: document.getElementById('pvField').value.trim(),
                tm: document.getElementById('tmField').value.trim(),
                np: document.getElementById('npField').value.trim(),
                cg: document.getElementById('cgField').value.trim(),
                quotaType: document.getElementById('quotaTypeField').value.trim(),
                company: selectedCompany, // ADD THIS
                betType: document.getElementById('betTypeField').value.trim(),
                betChosen: document.getElementById('betChosenField').value.trim(),
                bonusAmount: bonusAmount,
                matches: matches,
                betAmount: betAmount,
                showBottomImage: showBottomImage,
                imageUrls: imageUrls
            };

            displayTicket(ticketData);
            showStatus('generateTicketStatus', 'Ticket generated!');
        } catch (error) {
            alert(error.message);
            console.error('Generate Ticket Error:', error);
        }
    }

    function handlePrintTicket() {
        try {
            const ticketPreview = document.querySelector('.ticket');
            if (!ticketPreview) {
                throw new Error('Please generate a ticket first!');
            }

            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                    <head>
                        <link href="https://fonts.cdnfonts.com/css/lantinghei-tc" rel="stylesheet">
                        <title>Print Ticket</title>
                        <style>
                            .ticket-meta-line,
                            .ticket-meta-line span {
                                font-size: 11px !important;
                                font-family: 'Courier New' !important;
                            }
                            .ticket-details, .ticket-details div {
                                font-family: 'Courier New', monospace !important;
                                font-size: 11px !important;
                            }
                            .ticket-section-header {
                                font-family: "Calibri", sans-serif !important;
                                font-size: 16px !important;
                            }
                            .league-header {
                                font-family: Arial, sans-serif !important;
                                font-size: 9px !important;
                            }
                            .ticket-amount.large-amount {
                                font-family: Arial, sans-serif !important;
                                font-size: 24px !important;
                            }
                            .ticket-match-teams {
                                font-family: Arial, sans-serif !important;
                                font-size: 11px !important;
                                font-weight: bold !important;
                                -webkit-print-color-adjust: exact;
                                print-color-adjust: exact;
                            }
                            .ticket-match > .ticket-amount,
                            .ticket-match > .ticket-amount div {
                                font-family: Arial, sans-serif !important;
                                font-size: 9px !important;
                            }
                            .bet-odds-row {
                                font-family: Arial, sans-serif !important;
                                font-size: 11px !important;
                                display: flex;
                                width: 100%;
                            }
                            .bet-type {
                                font-weight: normal !important;
                                font-size: 11px !important;
                                flex: 1;
                                white-space: nowrap;
                                text-align: left;
                            }
                            .bet-chosen {
                                font-size: 11px !important;
                                padding-right: 0;
                                white-space: pre;
                            }
                            .odds-value {
                                font-size: 11px !important;
                                width: 50px;
                                text-align: right;
                            }
                            .bet-chosen, .odds-value {
                                font-weight: bold !important;
                                font-size: 11px !important;
                            }
                            .ticket-title-image {
                                height: 65px !important;
                                margin: 0 5px !important;
                            }
                            .ticket-meta-line {
                                display: flex;
                                justify-content: space-between;
                                margin: 2px 0;
                            }
                            .ticket-meta-line span {
                                white-space: nowrap;
                            }
                            body { font-family: 'Courier New', monospace; padding: 10px; }
                            .ticket {
                                width: 295px;

    function handleClearAll() {
        matches = [];
        document.getElementById('ticketContainer').innerHTML = '';
        document.getElementById('bonusGroup').classList.add('hidden');

        // Clear all input fields except defaults
        const preserveFields = ['quotaTypeField', 'betTypeField', 'betChosenField',
        'tgField', 'ibField', 'nsField', 'sportField',
        'ccField', 'ncField', 'pvField', 'tmField', 'npField','cgField'];

        document.querySelectorAll('input[type="text"], input[type="number"]').forEach(input => {
            if (!preserveFields.includes(input.id)) {
                input.value = '';
            }
        });

        // Reset dynamic values
        document.getElementById('ticketCodeField').value = Math.random().toString(36).substring(2, 10).toUpperCase();
        document.getElementById('timestampField').value = new Date().toLocaleTimeString();
        const today = new Date();
        const day = String(today.getDate()).padStart(2, '0');
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const year = today.getFullYear();
        document.getElementById('dateField').value = `${day}-${month}-${year}`;
        document.getElementById('matchDatePicker').valueAsDate = new Date();
    }

    function displayTicket(ticketData) {
        const container = document.getElementById('ticketContainer');
        const totalOdds = calculateTotalOdds(ticketData.matches);
        const potentialWinnings = (ticketData.betAmount * totalOdds) + (ticketData.bonusAmount || 0);

        // Group matches by league
        const matchesByLeague = {};
        ticketData.matches.forEach(match => {
            if (!matchesByLeague[match.leagueName]) {
                matchesByLeague[match.leagueName] = [];
            }
            matchesByLeague[match.leagueName].push(match);
        });

        // DETERMINE HEADER BASED ON COMPANY
        let headerHTML = '';
        if (ticketData.company === 'INTRALOT') {
            headerHTML = `
                <div class="ticket-header" style="justify-content: space-between; align-items: center; gap: 1px;">
                    <img src="${ticketData.imageUrls.intralotLogo}"
                         alt="INTRALOT"
                         style="height: 100px; width: 210px; object-fit: contain; flex-shrink: 0;">
                    <div style="display: flex; flex-direction: column; align-items: flex-end;">
                        <div style="font-size: 5.7px; font-weight: bold; margin-bottom: 2px;">BONUS BENVENUTO ONLI</div>
                        <img src="${ticketData.imageUrls.qrCode}" alt="QR Code" style="height: 70px;">
                    </div>
                </div>
            `;
        } else if (ticketData.company === 'BETTER') {
            headerHTML = `
                <div class="ticket-header" style="justify-content: space-between; align-items: center; gap: 1px;">
                    <img src="${ticketData.imageUrls.betterLogo}"
                         alt="BETTER"
                         style="height: 100px; width: 210px; object-fit: contain; flex-shrink: 0;">
                    <div style="display: flex; flex-direction: column; align-items: flex-end;">
                        <div style="font-size: 5.7px; font-weight: bold; margin-bottom: 2px;">BONUS BENVENUTO ONLI</div>
                        <img src="${ticketData.imageUrls.qrCode}" alt="QR Code" style="height: 70px;">
                    </div>
                </div>
            `;
        } else if (ticketData.company === 'PLANETWIN') {
            headerHTML = `
                <div class="ticket-header" style="justify-content: space-between; align-items: center; gap: 1px;">
                    <img src="${ticketData.imageUrls.planetwinLogo}"
                         alt="PLANETWIN"
                         style="height: 100px; width: 210px; object-fit: contain; flex-shrink: 0;">
                    <div style="display: flex; flex-direction: column; align-items: flex-end;">
                        <div style="font-size: 5.7px; font-weight: bold; margin-bottom: 2px;">BONUS BENVENUTO ONLI</div>
                        <img src="${ticketData.imageUrls.qrCode}" alt="QR Code" style="height: 70px;">
                    </div>
                </div>
            `;
        } else {
            // GOLDBET: Original two-image layout
            headerHTML = `
                <div class="ticket-header">
                    <img src="${ticketData.imageUrls.goldbetLogo}" alt="Logo" class="ticket-logo">
                    <img src="${ticketData.imageUrls.goldbetTitle}"
                         alt="GoldBet"
                         class="ticket-title-image"
                         style="height: 50px; margin: 0 5px;">
                    <div>
                        <div style="font-size: 5.7px; font-weight: bold;">BONUS BENVENUTO ONLI</div>
                        <img src="${ticketData.imageUrls.qrCode}" alt="QR Code" class="ticket-qr">
                    </div>
                </div>
            `;
        }

        // DETERMINE COMPANY NAME FOR NC FIELD
        const companyName = ticketData.company === 'INTRALOT' ? 'INTRALOT S.A.'
            : ticketData.company === 'BETTER' ? 'Better S.p.A'
            : ticketData.company === 'PLANETWIN' ? 'PlanetWin365 S.p.A'
            : 'GBO Italy S.p.A';

        // DETERMINE DISCLAIMER URL
        const disclaimerUrl = ticketData.company === 'INTRALOT' ? 'intralot.com'
            : ticketData.company === 'BETTER' ? 'better.it'
            : ticketData.company === 'PLANETWIN' ? 'planetwin365.it'
            : 'goldbet.it';

        const footerImage = ticketData.imageUrls.intralotFooter;

        container.innerHTML = `
            <div class="ticket">
                ${headerHTML}

                <div class="ticket-line"></div>

                <div class="ticket-details">
                    <div>CB-<strong>${ticketData.ticketCode}</strong></div>
                    <div class="ticket-meta-line">
                        <span>CC-<strong>${ticketData.cc}</strong></span>
                        <span>NC-<strong>${ticketData.nc}</strong></span>
                        <span>PV-<strong>${ticketData.pv}</strong></span>
                        <span>TM-<strong>${ticketData.tm}</strong></span>
                    </div>
                    <div class="ticket-meta-line">
                        <span>NP-<strong>${ticketData.np}</strong></span>
                        <span>TG-<strong>${ticketData.tg}</strong></span>
                    </div>
                    <div class="ticket-meta-line">
                        <span>GE-<strong>${formatDate(ticketData.date)}</strong></span>
                        <span>OE-<strong>${ticketData.timestamp}</strong></span>
                        <span>CG-<strong>${ticketData.cg}</strong></span>
                    </div>
                    <div class="ticket-meta-line">
                        <span>IB-<strong>${ticketData.ib}</strong></span>
                        <span>NS-<strong>${ticketData.ns}</strong></span>
                    </div>
                </div>

                <div class="ticket-line"></div>

                <div class="ticket-section">
                    <div class="ticket-section-header" style="line-height:1">${ticketData.quotaType.toUpperCase()}</div>
                    ${ticketData.company === 'BETTER'
                        ? ticketData.matches.map(match => `
                            <div class="ticket-match">
                                <div class="ticket-amount">
                                    <div>(${match.matchId}) ${match.code} ${match.sport}${' '.repeat(15 - match.sport.length)}</div>
                                    <div>${formatMatchDate(match.date)} ${match.time}</div>
                                </div>
                                <div class="ticket-match-teams">${match.team1} - ${match.team2}</div>
                                <div class="bet-odds-row">
                                    <div class="bet-type">${match.betType}</div>
                                    <div class="bet-chosen">${match.betChosen}  </div>
                                    <div class="odds-value">${formatNumber(match.odds)}</div>
                                </div>
                            </div>
                        `).join('')
                        : Object.entries(matchesByLeague).map(([leagueName, leagueMatches]) => `
                            <div class="league-header">${leagueName}</div>
                            ${leagueMatches.map(match => `
                                <div class="ticket-match">
                                    <div class="ticket-amount">
                                        <div>(${match.matchId}) ${match.code} ${match.sport}${' '.repeat(15 - match.sport.length)}</div>
                                        <div>${formatMatchDate(match.date)} ${match.time}</div>
                                    </div>
                                    <div class="ticket-match-teams">${match.team1} - ${match.team2}</div>
                                    <div class="bet-odds-row">
                                        <div class="bet-type">${match.betType}</div>
                                        <div class="bet-chosen">${match.betChosen}  </div>
                                        <div class="odds-value">${formatNumber(match.odds)}</div>
                                    </div>
                                </div>
                            `).join('')}
                        `).join('')
                    }
                </div>

                <div class="ticket-amount large-amount">
                  <div>IMPORTO SCOMMESSO</div>
                  <div>${formatNumber(ticketData.betAmount)} €</div>
                </div>

                ${ticketData.bonusAmount > 0 ? `
                <div class="ticket-amount large-amount">
                    <div>BONUS</div>
                    <div>${formatNumber(ticketData.bonusAmount)} €</div>
                </div>
                ` : ''}

                <div class="ticket-winnings">
                    <div class="ticket-winnings-pattern"></div>
                    <div class="ticket-winnings-center">
                        <div class="ticket-winnings-label">VINCITA TOTALE</div>
                        <div class="ticket-winnings-amount">${formatNumber(potentialWinnings)}€</div>
                    </div>
                    <div class="ticket-winnings-pattern"></div>
                </div>
                <div class="ticket-disclaimer">
                    Consulta le probabilità di vincita e i regolamenti di gioco su ${disclaimerUrl}.<br>
                    Il gioco è vietato ai minori di 18 anni e può causare dipendenza patologica.
                </div>

                <div class="ticket-footer">
                    <div class="footer-disclaimer-container">
                        <img src="${footerImage}" alt="Footer Logo" class="footer-single-image">
                    </div>
                </div>
                <img src="${ticketData.imageUrls.barcode}" alt="Barcode" class="ticket-barcode">
                ${ticketData.showBottomImage ? `
                <img src="${ticketData.imageUrls.intralotBottom}" alt="Intralot Bottom" class="ticket-barcode" style="width: 309px; height: 80px;">
                ` : ''}
            </div>
        `;
    }

    // Helper functions
    function showStatus(elementId, message) {
        const element = document.getElementById(elementId);
        if (element) {
            element.textContent = message;
            setTimeout(() => element.textContent = '', 3000);
        }
    }

    function updateMatchList() {
        const container = document.getElementById('ticketContainer');
        container.innerHTML = `
            <h4>Current Matches (${matches.length})</h4>
            <ul class="list-group">
                ${matches.map((match, index) => `
                    <li class="list-group-item">
                        ${index + 1}. ${match.team1} vs ${match.team2} @ ${match.odds.toFixed(2)}
                        <button class="btn btn-sm btn-danger float-end" onclick="removeMatch(${index})">Remove</button>
                    </li>
                `).join('')}
            </ul>
        `;
    }

    function removeMatch(index) {
        matches.splice(index, 1);
        if (matches.length < 5) {
            document.getElementById('bonusGroup').classList.add('hidden');
        }
        updateMatchList();
    }

    function calculateTotalOdds(matches) {
        return matches.reduce((total, match) => total * match.odds, 1);
    }

    function formatNumber(number) {
        return (Math.floor(number * 100) / 100).toFixed(2).replace('.', ',');
    }

    function formatDate(dateString) {
        const months = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu',
                        'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
        const date = new Date(dateString);
        const day = String(date.getDate()).padStart(2, '0'); // This adds leading zero
        const month = months[date.getMonth()];
        const year = date.getFullYear();
        return `${day}.${month}.${year}`;
    }
    function formatMatchDate(dateString) {
        // Convert "DD-MM-YYYY" to "DD-MM-YY"
        // Example: "09-12-2025" → "09-12-25"
        const parts = dateString.split('-');
        if (parts.length === 3) {
            const day = parts[0];
            const month = parts[1];
            const year = parts[2].slice(-2); // Get last 2 digits
            return `${day}-${month}-${year}`;
        }
        return dateString; // If format is wrong, return as is
    }

    // Make removeMatch available globally for the inline onclick
    window.removeMatch = removeMatch;
</script>
